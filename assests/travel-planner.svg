  <rect x="218" y="370" width="182" height="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="400" y="370" width="182" height="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="582" y="370" width="182" height="46" fill="url(#tp-soft)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="388" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#64748b">CITY</text>
  <text x="52" y="404" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#0f172a">Tokyo</text>
  <text x="234" y="388" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#64748b">COUNTRY</text>
  <text x="234" y="404" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#0f172a">Japan</text>
  <text x="416" y="388" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#64748b">DURATION</text>
  <text x="416" y="404" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#0f172a">7 days</text>
  <text x="598" y="388" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#64748b">BUDGET</text>
  <text x="598" y="404" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#7c3aed">Rs. 42000</text>

  <line x1="56" y1="430" x2="56" y2="452" stroke="#ede9fe" stroke-width="2"/>
  <circle cx="56" cy="438" r="5" fill="url(#tp-accent)" stroke="#ffffff" stroke-width="2"/>
  <rect x="72" y="426" width="52" height="18" rx="9" fill="url(#tp-accent)"/>
  <text x="98" y="439" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#ffffff">Day 1</text>
  <text x="132" y="439" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Shibuya crossing, teamLab visit</text>

  <line x1="56" y1="452" x2="56" y2="462" stroke="#ede9fe" stroke-width="2"/>
  <circle cx="56" cy="458" r="4" fill="#c4b5fd" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="72" y="448" width="52" height="18" rx="9" fill="#ede9fe"/>
  <text x="98" y="460" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#7c3aed">Day 2</text>
  <text x="132" y="460" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Senso-ji Temple, Asakusa food tour</text>

  <rect x="0" y="478" width="800" height="42" rx="0" fill="#0f172a"/>
  <rect x="0" y="478" width="800" height="42" rx="24" fill="#0f172a"/>
  <text x="400" y="504" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Travel Planner | AI-powered trip planning</text>
</svg>
