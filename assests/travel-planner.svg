    <text x="96" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#64748b">Details</text>
    <rect x="148" y="218" width="100" height="28" rx="6" fill="#7c3aed"/>
    <text x="198" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#ffffff">Favourites</text>

    <rect x="286" y="128" width="228" height="168" rx="12" fill="#ffffff" stroke="rgba(124,58,237,0.35)" stroke-width="1.5"/>
