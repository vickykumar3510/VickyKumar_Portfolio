  <rect x="36" y="314" width="728" height="154" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#tp-sh)"/>
  <rect x="36" y="314" width="728" height="56" rx="14" fill="url(#tp-accent)"/>
  <rect x="36" y="354" width="728" height="16" fill="url(#tp-accent)"/>
  <text x="52" y="342" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Tokyo Explorer</text>
  <text x="52" y="358" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="rgba(255,255,255,0.88)">Tokyo, Japan | 7 days itinerary</text>

