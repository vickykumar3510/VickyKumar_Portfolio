<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Travel Planner app preview with destinations and AI itinerary">
  <defs>
    <linearGradient id="tp-page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8ff"/>
      <stop offset="55%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <linearGradient id="tp-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="45%" style="stop-color:#9333ea"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="tp-soft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ede9fe"/>
      <stop offset="100%" style="stop-color:#eef2ff"/>
    </linearGradient>
    <filter id="tp-sh" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.12"/>
    </filter>
    <filter id="tp-nav" x="-5%" y="-20%" width="110%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="24" fill="url(#tp-page)"/>
  <rect width="800" height="520" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <ellipse cx="120" cy="40" rx="180" ry="100" fill="rgba(124,58,237,0.06)"/>
  <ellipse cx="700" cy="480" rx="160" ry="90" fill="rgba(99,102,241,0.05)"/>

  <g filter="url(#tp-nav)">
    <rect x="0" y="0" width="800" height="58" rx="24" fill="#ffffff"/>
    <rect x="0" y="46" width="800" height="12" fill="#ffffff"/>
    <line x1="0" y1="58" x2="800" y2="58" stroke="#e2e8f0" stroke-width="1"/>
  </g>

  <circle cx="44" cy="29" r="14" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <circle cx="44" cy="29" r="6" fill="none" stroke="#7c3aed" stroke-width="1.2"/>
  <ellipse cx="44" cy="29" rx="6" ry="3" fill="none" stroke="#7c3aed" stroke-width="1"/>
  <line x1="38" y1="29" x2="50" y2="29" stroke="#7c3aed" stroke-width="1"/>
  <text x="68" y="38" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a" letter-spacing="-0.03em">Travel Planner</text>

  <rect x="248" y="20" width="72" height="24" rx="6" fill="#ede9fe"/>
  <text x="284" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#7c3aed">Destinations</text>
  <text x="342" y="36" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#64748b">Favourites (2)</text>
  <text x="434" y="36" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#64748b">My Orders (1)</text>
  <text x="518" y="36" font-family="system-ui,sans-serif" font-size="10" font-weight="500" fill="#64748b">AI Planner</text>
  <rect x="598" y="18" width="72" height="28" rx="6" fill="rgba(220,38,38,0.06)" stroke="rgba(220,38,38,0.15)" stroke-width="1"/>
