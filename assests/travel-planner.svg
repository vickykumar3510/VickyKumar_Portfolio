    <text x="562" y="186" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Bali, Indonesia</text>
    <text x="562" y="198" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">6 days | Rs. 35000</text>
    <rect x="552" y="218" width="88" height="28" rx="6" fill="transparent" stroke="#e2e8f0" stroke-width="1"/>
    <text x="596" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#64748b">Details</text>
    <rect x="648" y="218" width="100" height="28" rx="6" fill="#7c3aed"/>
    <text x="698" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#ffffff">Favourites</text>
