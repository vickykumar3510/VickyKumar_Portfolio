    <text x="448" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#64748b">Added</text>

    <rect x="536" y="128" width="228" height="168" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="536" y="128" width="228" height="4" rx="12" fill="url(#tp-accent)" opacity="0"/>
    <text x="552" y="162" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Bali Retreat</text>
