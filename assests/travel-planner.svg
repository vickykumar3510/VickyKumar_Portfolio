    <text x="312" y="186" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Tokyo, Japan</text>
    <text x="312" y="198" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">7 days | Rs. 42000</text>
    <rect x="302" y="218" width="88" height="28" rx="6" fill="#7c3aed"/>
    <text x="346" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#ffffff">Details</text>
