<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="chatApp preview">
  <defs>
    <linearGradient id="ch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1929"/>
      <stop offset="50%" style="stop-color:#122a52"/>
      <stop offset="100%" style="stop-color:#1e3a6f"/>
    </linearGradient>
    <linearGradient id="ch-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1530"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="ch-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#162544"/>
      <stop offset="100%" style="stop-color:#0f2140"/>
    </linearGradient>
    <linearGradient id="ch-msg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <filter id="ch-sh" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="ch-incoming" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="24" fill="url(#ch-bg)"/>
  <ellipse cx="-40" cy="520" rx="200" ry="120" fill="#2563eb" fill-opacity="0.12"/>
  <ellipse cx="820" cy="40" rx="180" ry="100" fill="#38bdf8" fill-opacity="0.1"/>
  <g filter="url(#ch-sh)">
    <rect x="38" y="42" width="226" height="436" rx="18" fill="url(#ch-side)" stroke="#1e40af" stroke-width="2"/>
  </g>
  <text x="88" y="78" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="16" font-weight="800">Chats</text>
  <circle cx="86" cy="118" r="22" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="154" cy="118" r="22" fill="#1e40af" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="222" cy="118" r="22" fill="#172554"/>
  <rect x="58" y="162" width="186" height="10" rx="3" fill="#334155"/>
  <rect x="58" y="184" width="142" height="10" rx="3" fill="#1e293b"/>
  <rect x="58" y="206" width="168" height="10" rx="3" fill="#334155"/>
  <rect x="58" y="228" width="110" height="10" rx="3" fill="#1e293b"/>
  <rect x="58" y="250" width="156" height="10" rx="3" fill="#334155"/>
  <g filter="url(#ch-sh)">
    <rect x="280" y="42" width="482" height="436" rx="18" fill="url(#ch-panel)" stroke="#2563eb" stroke-opacity="0.65" stroke-width="2"/>
  </g>
  <rect x="360" y="56" width="200" height="8" rx="4" fill="#334155"/>
  <!-- incoming bubble on dark -->
  <rect x="302" y="88" width="284" height="54" rx="27" fill="url(#ch-incoming)" stroke="#475569" stroke-width="1"/>
  <!-- outgoing -->
  <rect x="368" y="158" width="372" height="54" rx="27" fill="url(#ch-msg)" stroke="#60a5fa" stroke-width="1"/>
  <rect x="302" y="228" width="252" height="50" rx="25" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1"/>
  <circle cx="712" cy="312" r="9" fill="#22c55e" stroke="#0f172a" stroke-width="2"/>
  <circle cx="712" cy="338" r="9" fill="#22c55e" stroke="#0f172a" stroke-width="2"/>
  <circle cx="712" cy="364" r="9" fill="#475569"/>
  <!-- composer -->
  <rect x="294" y="406" width="454" height="54" rx="27" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
  <rect x="318" y="422" width="120" height="22" rx="11" fill="#1e3a8a" stroke="#60a5fa" stroke-opacity="0.45"/>
</svg>
