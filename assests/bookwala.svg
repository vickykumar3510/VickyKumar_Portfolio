<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="BookWala — dashboard with black nav and purple accent">
  <defs>
    <linearGradient id="bw-page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f3f9"/>
      <stop offset="100%" style="stop-color:#eeedf5"/>
    </linearGradient>
    <linearGradient id="bw-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#aa3bff"/>
      <stop offset="100%" style="stop-color:#8b2fd9"/>
    </linearGradient>
    <linearGradient id="bw-cover1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e4ef"/>
      <stop offset="100%" style="stop-color:#d4cdd9"/>
    </linearGradient>
    <linearGradient id="bw-cover2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ddd6e8"/>
      <stop offset="100%" style="stop-color:#c4b8d4"/>
    </linearGradient>
    <linearGradient id="bw-cover3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ece8f2"/>
      <stop offset="100%" style="stop-color:#d8d2e0"/>
    </linearGradient>
    <filter id="bw-sh" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <filter id="bw-nav" x="-5%" y="-20%" width="110%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Page canvas -->
  <rect width="800" height="520" rx="24" fill="url(#bw-page)"/>
  <rect width="800" height="520" rx="24" fill="none" stroke="#e5e4e7" stroke-width="2"/>

  <!-- Black sticky header (site-header) -->
  <g filter="url(#bw-nav)">
    <rect x="0" y="0" width="800" height="58" rx="24" fill="#1a1b22"/>
    <rect x="0" y="46" width="800" height="12" fill="#1a1b22"/>
    <line x1="0" y1="58" x2="800" y2="58" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="0" y1="57" x2="800" y2="57" stroke="rgba(170,59,255,0.14)" stroke-width="1"/>
  </g>

  <!-- Logo -->
  <rect x="36" y="14" width="36" height="36" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <path d="M48 22h12v16H48V22zm2 2v12h8V24h-8z" fill="#aa3bff"/>
  <text x="82" y="38" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#f4f4f5" letter-spacing="-0.03em">BookWala</text>

  <!-- Search -->
  <rect x="168" y="16" width="280" height="34" rx="10" fill="#f4f4f5" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="184" y="38" font-family="system-ui,sans-serif" font-size="11" fill="#6b6375">Search by book or author</text>

  <!-- Nav links -->
  <text x="492" y="38" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.88)">Profile</text>
  <text x="558" y="38" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.88)">Wishlist</text>
  <rect x="612" y="22" width="22" height="18" rx="9" fill="rgba(192,132,252,0.22)" stroke="rgba(192,132,252,0.45)" stroke-width="1"/>
  <text x="623" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#e9d5ff">2</text>
  <text x="648" y="38" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.88)">Cart</text>
  <rect x="682" y="22" width="22" height="18" rx="9" fill="rgba(34,197,94,0.22)" stroke="rgba(34,197,94,0.45)" stroke-width="1"/>
  <text x="693" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#bbf7d0">1</text>
  <rect x="718" y="16" width="56" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="746" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.82)">Log out</text>

  <!-- Filter sidebar panel -->
  <rect x="32" y="78" width="188" height="418" rx="12" fill="#fff" stroke="#e5e4e7" stroke-width="1" filter="url(#bw-sh)"/>
  <text x="52" y="108" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#08060d">Refine results</text>
  <rect x="52" y="118" width="88" height="22" rx="6" fill="rgba(170,59,255,0.08)" stroke="rgba(170,59,255,0.35)" stroke-width="1"/>
  <text x="96" y="133" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#aa3bff">Clear all filters</text>

  <text x="52" y="162" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#6b6375">Sort by price</text>
  <circle cx="58" cy="180" r="5" fill="#fff" stroke="#aa3bff" stroke-width="2"/>
  <circle cx="58" cy="180" r="2.5" fill="#aa3bff"/>
  <text x="72" y="184" font-family="system-ui,sans-serif" font-size="10" fill="#08060d">Low to high</text>
  <circle cx="58" cy="202" r="5" fill="#fff" stroke="#e5e4e7" stroke-width="1.5"/>
  <text x="72" y="206" font-family="system-ui,sans-serif" font-size="10" fill="#6b6375">High to low</text>

  <text x="52" y="238" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#6b6375">Rating</text>
  <rect x="52" y="248" width="8" height="8" rx="2" fill="#aa3bff"/>
  <text x="68" y="256" font-family="system-ui,sans-serif" font-size="10" fill="#08060d">All ratings</text>
  <rect x="52" y="268" width="8" height="8" rx="2" fill="#fff" stroke="#e5e4e7" stroke-width="1"/>
  <text x="68" y="276" font-family="system-ui,sans-serif" font-size="10" fill="#6b6375">Above 9</text>

  <!-- Main: Browse books toolbar -->
  <text x="244" y="108" font-family="system-ui,sans-serif" font-size="18" font-weight="500" fill="#08060d" letter-spacing="-0.02em">Browse books</text>
  <rect x="368" y="92" width="72" height="22" rx="6" fill="#f4f3ec" stroke="#e5e4e7" stroke-width="1"/>
  <text x="404" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#6b6375">12 Book(s)</text>

  <!-- Genre chips -->
  <rect x="244" y="122" width="72" height="28" rx="14" fill="rgba(170,59,255,0.12)" stroke="rgba(170,59,255,0.55)" stroke-width="1"/>
  <text x="280" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#08060d">All Genre</text>
  <rect x="324" y="122" width="58" height="28" rx="14" fill="#fff" stroke="#e5e4e7" stroke-width="1"/>
  <text x="353" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b6375">Fantasy</text>
  <rect x="390" y="122" width="62" height="28" rx="14" fill="#fff" stroke="#e5e4e7" stroke-width="1"/>
  <text x="421" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b6375">Mystery</text>
  <rect x="460" y="122" width="72" height="28" rx="14" fill="#fff" stroke="#e5e4e7" stroke-width="1"/>
  <text x="496" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b6375">Thriller</text>

  <!-- Book cards (dashboard__card) -->
  <g filter="url(#bw-sh)">
    <!-- Card 1 -->
    <rect x="244" y="168" width="168" height="318" rx="12" fill="#fff" stroke="#e5e4e7" stroke-width="1"/>
    <rect x="244" y="168" width="168" height="140" rx="12" fill="url(#bw-cover1)"/>
    <rect x="244" y="296" width="168" height="12" fill="#fff"/>
    <rect x="356" y="180" width="44" height="20" rx="6" fill="rgba(255,255,255,0.92)" stroke="#e5e4e7" stroke-width="1"/>
    <text x="378" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#08060d">★ 9.2</text>
    <rect x="256" y="312" width="120" height="10" rx="2" fill="#08060d" opacity="0.85"/>
    <rect x="256" y="328" width="96" height="7" rx="2" fill="#6b6375" opacity="0.6"/>
    <rect x="256" y="342" width="64" height="16" rx="4" fill="#f4f3ec" stroke="#e5e4e7" stroke-width="1"/>
    <text x="288" y="354" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#6b6375">Fiction</text>
    <text x="256" y="378" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#08060d">Rs. 499</text>
    <rect x="256" y="388" width="144" height="32" rx="8" fill="url(#bw-accent)"/>
    <text x="328" y="408" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff">Add to cart</text>
    <rect x="256" y="428" width="144" height="26" rx="8" fill="#fff" stroke="#e5e4e7" stroke-width="1"/>
    <text x="328" y="445" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#6b6375">Add to wishlist</text>
    <text x="328" y="472" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#aa3bff">View details</text>

    <!-- Card 2 -->
    <rect x="424" y="168" width="168" height="318" rx="12" fill="#fff" stroke="rgba(170,59,255,0.35)" stroke-width="1"/>
    <rect x="424" y="168" width="168" height="140" rx="12" fill="url(#bw-cover2)"/>
    <rect x="424" y="296" width="168" height="12" fill="#fff"/>
    <rect x="536" y="180" width="44" height="20" rx="6" fill="rgba(255,255,255,0.92)" stroke="#e5e4e7" stroke-width="1"/>
    <text x="558" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#08060d">★ 8.7</text>
    <rect x="436" y="312" width="110" height="10" rx="2" fill="#08060d" opacity="0.85"/>
    <rect x="436" y="328" width="88" height="7" rx="2" fill="#6b6375" opacity="0.6"/>
    <text x="436" y="378" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#08060d">Rs. 349</text>
    <rect x="436" y="388" width="68" height="32" rx="8" fill="#f4f3f9" stroke="#e5e4e7" stroke-width="1"/>
    <text x="470" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#aa3bff">−</text>
    <text x="470" y="412" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#08060d">2</text>
    <rect x="508" y="388" width="28" height="32" rx="8" fill="#f4f3f9" stroke="#e5e4e7" stroke-width="1"/>
    <text x="522" y="408" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#aa3bff">+</text>
    <rect x="436" y="428" width="144" height="26" rx="8" fill="rgba(170,59,255,0.08)" stroke="rgba(170,59,255,0.45)" stroke-width="1"/>
    <text x="508" y="445" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#aa3bff">Add to wishlist</text>

    <!-- Card 3 -->
    <rect x="604" y="168" width="168" height="318" rx="12" fill="#fff" stroke="#e5e4e7" stroke-width="1"/>
    <rect x="604" y="168" width="168" height="140" rx="12" fill="url(#bw-cover3)"/>
    <rect x="604" y="296" width="168" height="12" fill="#fff"/>
    <rect x="716" y="180" width="44" height="20" rx="6" fill="rgba(255,255,255,0.92)" stroke="#e5e4e7" stroke-width="1"/>
    <text x="738" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#08060d">★ 9.5</text>
    <rect x="616" y="312" width="128" height="10" rx="2" fill="#08060d" opacity="0.85"/>
    <rect x="616" y="328" width="100" height="7" rx="2" fill="#6b6375" opacity="0.6"/>
    <text x="616" y="378" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#08060d">Rs. 599</text>
    <rect x="616" y="388" width="144" height="32" rx="8" fill="url(#bw-accent)"/>
    <text x="688" y="408" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff">Add to cart</text>
    <rect x="616" y="428" width="144" height="26" rx="8" fill="#fff" stroke="#e5e4e7" stroke-width="1"/>
    <text x="688" y="445" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#6b6375">Add to wishlist</text>
  </g>

  <!-- Subtle book silhouettes in covers -->
  <rect x="268" y="200" width="48" height="72" rx="4" fill="#fff" opacity="0.35"/>
  <rect x="448" y="195" width="52" height="78" rx="4" fill="#fff" opacity="0.3"/>
  <rect x="628" y="202" width="46" height="70" rx="4" fill="#fff" opacity="0.32"/>
</svg>
